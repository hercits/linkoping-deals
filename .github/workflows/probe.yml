name: Probe image sizes
on:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try image sizes and the offer detail page
        run: |
          mkdir -p probe
          B="https://mpk-product-images.s3.eu-north-1.amazonaws.com/d740cdd2-a5ff-4adf-8c91-5eb157234040"
          for n in thumb100p thumb150p thumb200p thumb250p thumb300p thumb400p thumb500p thumb600p thumb800p thumb1000p original large medium full image product 100p 300p 500p; do
            for ext in jpeg jpg png webp; do
              code=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" "$B/$n.$ext"); echo "$n.$ext $code"
            done
          done | grep -v "^.* 40[34] " | tee probe/sizes.txt
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" "https://matpriskollen.se/deal/60a816ab-8b03-40ba-bf38-abed7ef42078" -o probe/deal.html
          grep -oE 'https://mpk-product-images[^"\\ ]+' probe/deal.html | sort -u | tee probe/deal-images.txt
          curl -s "https://mpk-product-images.s3.eu-north-1.amazonaws.com/?prefix=d740cdd2-a5ff-4adf-8c91-5eb157234040/" | head -c 3000 > probe/listing.xml; cat probe/listing.xml | head -c 600
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe: image sizes" && git pull --rebase && git push
